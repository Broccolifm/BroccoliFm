<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Broccoli FM — Tunes for the Growers</title>

  <!-- Friendly hand-drawn fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Karla:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      font-family:"Karla",sans-serif;
      background:#F8F4ED;
      color:#2A2A2A;
      line-height:1.5;
      text-align:center;
    }
    h1,h2{
      font-family:"Patrick Hand",cursive;
      margin:.5em 0;
    }
    header{
      padding:2rem 1rem 1rem;
    }
    .player{
      background:#F8F4ED;
      border:3px solid #2A2A2A;
      border-radius:20px;
      box-shadow:6px 6px 0 #2A2A2A;
      display:inline-block;
      padding:1.5rem;
      margin:1rem auto;
      max-width:320px;
    }
    button{
      background:#2A2A2A;
      color:#F8F4ED;
      border:none;
      border-radius:12px;
      padding:.6rem 1rem;
      font-family:inherit;
      font-size:1rem;
      margin:.3rem;
    }
    button:disabled{opacity:.6}
    input[type=range]{width:100%}
    section{padding:1rem}
    footer{
      margin:2rem 0 1rem;
      font-size:.9rem;
      opacity:.8;
    }
  </style>
</head>

<body>
  <header>
    <h1>BROCCOLI FM</h1>
    <p><em>tunes for the growers 🌿</em></p>
  </header>

  <main>
    <div class="player">
      <h2>Live Radio Player</h2>
      <audio id="radio" preload="none"></audio>
      <div>
        <button id="play">▶️ Play</button>
        <button id="pause" disabled>⏸ Pause</button>
        <button id="stop" disabled>⏹ Stop</button>
      </div>
      <div style="margin-top:.5rem">
        <label>Volume</label>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
      </div>
    </div>

    <section>
      <h2>Today’s Shows</h2>
      <p><strong>Morning Watering</strong> — 07:00 to 09:00</p>
      <p><strong>Greenhouse Grooves</strong> — 12:00 to 14:00</p>
      <p><strong>After-Rain Radio</strong> — 18:00 to 20:00</p>
    </section>
  </main>

  <footer>© <span id="year"></span> Broccoli FM — growing good vibes daily.</footer>

  <script>
    const STREAM_URL = "https://example.com/live.mp3"; // 🔸 replace with your real stream
    const audio  = document.getElementById("radio");
    const playB  = document.getElementById("play");
    const pauseB = document.getElementById("pause");
    const stopB  = document.getElementById("stop");
    const vol    = document.getElementById("volume");
    const year   = document.getElementById("year");

    audio.src = STREAM_URL;
    audio.volume = parseFloat(vol.value);
    year.textContent = new Date().getFullYear();

    playB.onclick = async () => {
      try {
        await audio.play();
        playB.disabled = true;
        pauseB.disabled = false;
        stopB.disabled = false;
      } catch(e){
        alert("Tap once more to allow audio to start (mobile browsers need a gesture).");
      }
    };
    pauseB.onclick = () => {
      audio.pause();
      playB.disabled = false;
      pauseB.disabled = true;
    };
    stopB.onclick = () => {
      audio.pause();
      audio.currentTime = 0;
      playB.disabled = false;
      pauseB.disabled = true;
    };
    vol.oninput = e => audio.volume = parseFloat(e.target.value);
  </script>
</body>
</html>
